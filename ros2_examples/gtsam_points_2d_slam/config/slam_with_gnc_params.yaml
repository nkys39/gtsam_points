slam_with_gnc:
  ros__parameters:
    # Frame IDs
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"
    scan_topic: "scan"

    # Keyframe selection
    keyframe_distance: 0.5      # Distance threshold [m]
    keyframe_angle: 0.3          # Angle threshold [rad]

    # Correspondence distance
    max_correspondence_distance: 1.0  # Maximum correspondence distance [m]

    # GNC (Graduated Non-Convexity) parameters
    # These parameters control the weighted ICP with Geman-McClure robust cost
    gnc_mu_init: 1.0                    # Initial μ value (lower = more robust)
    gnc_mu_step: 1.4                    # μ multiplication factor per iteration
    gnc_max_iterations: 50              # Maximum GNC iterations
    gnc_convergence_threshold: 1.0e-6   # Convergence threshold for cost change
    gnc_inlier_threshold: 0.1           # Inlier distance threshold [m]

# Algorithm explanation:
#
# GNC (Graduated Non-Convexity) uses the Geman-McClure robust cost function:
#   ρ(r) = r² / (μ + r²)
#   w(r) = μ / (μ + r²)²
#
# Process:
# 1. Start with small μ (robust to outliers)
# 2. Find correspondences and compute weights using Geman-McClure
# 3. Perform weighted alignment with align_points_se2
# 4. Increase μ by gnc_mu_step
# 5. Repeat until convergence
#
# As μ increases, the cost function becomes less robust (approaches L2)
# This "graduated" approach starts robust and gradually becomes precise
