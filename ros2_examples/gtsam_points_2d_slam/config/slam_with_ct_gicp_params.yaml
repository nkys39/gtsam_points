/**:
  ros__parameters:
    # Frame IDs
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"

    # Topics
    scan_topic: "scan"

    # Keyframe selection
    keyframe_distance: 0.5     # meters
    keyframe_angle: 0.3        # radians (~17 degrees)

    # CT-GICP parameters
    max_correspondence_distance: 1.0  # meters
    k_neighbors: 10            # Number of neighbors for normal/covariance estimation

    # Note: CT-GICP uses timestamps from LaserScan.time_increment
    # and Mahalanobis distance with per-point covariances
