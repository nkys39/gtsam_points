/**:
  ros__parameters:
    # Frame IDs
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"

    # Topics
    scan_topic: "scan"
    imu_topic: "imu"

    # SLAM parameters
    use_vgicp: true            # Use VGICP (true) or GICP (false)

    # Keyframe selection
    keyframe_distance: 0.5     # meters
    keyframe_angle: 0.3        # radians (~17 degrees)

    # Voxel/Grid parameters
    voxel_resolution: 0.1      # meters

    # Scan matching parameters
    max_correspondence_distance: 1.0  # meters

    # IMU integration parameters
    use_imu: true              # Enable IMU integration
    imu_acc_noise: 0.1         # Accelerometer noise (m/s^2)
    imu_gyro_noise: 0.01       # Gyroscope noise (rad/s)
    imu_acc_bias_noise: 0.001  # Accelerometer bias random walk (m/s^3)
    imu_gyro_bias_noise: 0.0001  # Gyroscope bias random walk (rad/s^2)
    gravity: 9.81              # Gravity magnitude (m/s^2)
